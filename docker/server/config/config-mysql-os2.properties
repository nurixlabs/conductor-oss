# =============================================================================
# Conductor OSS - MySQL + OpenSearch 2.x Configuration
# =============================================================================

# --- Persistence: MySQL ---
conductor.db.type=mysql
spring.datasource.url=${CONDUCTOR_REDISLOCK_SERVERADDRESS:jdbc:mysql://mysql:3306/conductor}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:conductor}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:conductor}
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=15
spring.datasource.hikari.connection-timeout=2000

spring.flyway.baselineOnMigrate=true

# --- Locking: Redis (Redisson-based distributed lock) ---
# Queue is handled by MySQLQueueDAO — activated automatically when conductor.db.type=mysql.
# Redis is only needed here for distributed locking across multiple pods.
# conductor.redis-lock.serverAddress is required when workflow-execution-lock.type=redis.
# Without it, Redisson client fails to initialize and the app crashes on startup.
# In EKS, inject REDIS_LOCK_SERVER_ADDRESS from Secrets Manager.
conductor.workflow-execution-lock.type=redis
conductor.app.workflowExecutionLockEnabled=true
conductor.app.lockTimeToTry=500
conductor.redis-lock.serverType=SINGLE
conductor.redis-lock.serverAddress=${CONDUCTOR_REDISLOCK_SERVERADDRESS:redis://rs:6379}
conductor.redis-lock.useSsl=false
conductor.redis-lock.serverMasterName=master
conductor.redis-lock.namespace=conductor_locks

# --- Indexing: OpenSearch 2.x ---
# Overrides application.properties defaults (localhost:9200, elasticsearch type)
conductor.indexing.enabled=true
conductor.indexing.type=opensearch2
conductor.opensearch.url=${CONDUCTOR_OPENSEARCH_URL:http://os:9200}
conductor.opensearch.indexPrefix=conductor
conductor.opensearch.indexReplicasCount=1
conductor.opensearch.clusterHealthColor=yellow
conductor.app.asyncIndexingEnabled=true
conductor.app.asyncUpdateDelay=10s
conductor.app.asyncUpdateShortRunningWorkflowDuration=10s

# Override application.properties default (sqs)
conductor.default-event-queue.type=conductor

# --- App ---
conductor.app.ownerEmailMandatory=false
conductor.app.workflow.name-validation.enabled=false
conductor.app.summary-input-output-json-serialization.enabled=true
conductor.app.systemTaskWorkerThreadCount=20
conductor.app.systemTaskMaxPollCount=20
conductor.app.systemTaskWorkerCallbackDuration=1s

# --- Rollbar (inject via env vars) ---
conductor.rollbar.access-token=${CONDUCTOR_ROLLBAR_ACCESS_TOKEN:}
conductor.rollbar.environment=${CONDUCTOR_ROLLBAR_ENVIRONMENT:production}

# Load sample kitchen-sink workflow (set false for production)
loadSample=false